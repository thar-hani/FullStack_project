<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Profile</title>
    <link rel="stylesheet" href="../css/edit_profile.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>

  <body>
    <header>
       <div class="name">
        <a href="../index.html" class="story">
            <img src="../assets/book (1).png" class="book">
            <div class="logo">My Journal</div>
        </a>
    </div>

      <div class="features">
        <a href="./save-journal.html" class="story">My Journey</a>
        <a href="./journal.html" class="story">Story</a>
        <a href="./to-do-list.html" class="todo">Todo</a>
        <a href="./wish-list.html" class="wishe">Wishes</a>
        <a href="./profile.html" class="profile">Profile </a>
        <a href="./login.html" class="icon-btn logout"><i class="fa-solid fa-right-from-bracket"></i></a>
      </div>

    </header>

    <div class="container">
      <div class="edit-box">
        <div class="header">
          <a href="./profile.html" class="back-btn">← Back</a>
          <h2>Edit Profile</h2>
        </div>

        <form>
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="Enter your name" required />

          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
          />

          <label for="password">New Password</label>
          <input
            type="password"
            id="password"
            placeholder="Enter new password"
            required
          />

          <button type="submit" class="save-btn">Save Changes</button>
        </form>
      </div>
    </div>
    <script>
      async function fetchProfile() {
        const userId = localStorage.getItem("user_id");
        if (!userId) {
          console.warn("No user_id found in localStorage");
          alert("Please login first.");
          window.location.href = "./login.html";
          return;
        }

        try {
          const response = await fetch("/api/users/profile", {
            method: "GET",
            headers: {
              "X-User-ID": userId
            }
          });

          if (response.ok) {
            const userData = await response.json();
            console.log("Profile data fetched successfully for editing:", userData);
            document.getElementById("name").value = userData.full_name;
            document.getElementById("email").value = userData.emailID;
          } else {
            console.error("Failed to fetch profile:", response.status, response.statusText);
            alert("Session expired or invalid. Please login again.");
            window.location.href = "./login.html";
          }
        } catch (error) {
          console.error("Error fetching profile:", error);
          alert("An error occurred while fetching your profile.");
        }
      }

      // Fetch profile on page load
      document.addEventListener('DOMContentLoaded', fetchProfile);
    </script>
  </body>
</html>
