<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Journal - Profile</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../css/profile.css" />
  </head>

  <body>
    <header>
       <div class="name">
        <a href="../index.html" class="story">
            <img src="../assets/book (1).png" class="book">
            <div class="logo">My Journal</div>
        </a>
    </div>
      <div class="features">
        <a href="./save-journal.html" class="story">My Journey</a>
        <a href="./journal.html" class="story">Story</a>
        <a href="./to-do-list.html" class="todo">Todo</a>
        <a href="./wish-list.html" class="wishe">Wishes</a>
        <a href="./profile.html" class="profile">Profile </a>
        <a href="./login.html" class="icon-btn logout"><i class="fa-solid fa-right-from-bracket"></i></a>
      </div>

    </header>
    <div class="profile-box">
      <div class="profile-header">
        <h2>My Profile</h2>
      </div>

      <div class="profile-pic">
        <div class="avatar" id="avatar">T</div>
     </div>

      <form class="profile-form">

        <label>Name</label>
        <input type="text" id="profileName" placeholder="Enter your name" required />

        <label>Email</label>
        <input type="email" id="profileEmail" placeholder="Enter your email" required />
      </form>

      <a class="edit-btn" href="./edit_profice.html">Edit Profile</a>
      <div class="back-section">
        <a href="../index.html" class="back-btn">← Back to home</a>
      </div>
    </div>

    <script>
      async function fetchProfile() {
        const userId = localStorage.getItem("user_id");
        if (!userId) {
          console.warn("No user_id found in localStorage");
          alert("Please login first.");
          window.location.href = "./login.html";
          return;
        }

        try {
          // Use relative path for Vercel deployment compatibility
          const response = await fetch("/api/users/profile", {
            method: "GET",
            headers: {
              "X-User-ID": userId
            }
          });

          if (response.ok) {
            const userData = await response.json();
            console.log("Profile data fetched successfully:", userData);
            document.getElementById("profileName").value = userData.full_name;
            document.getElementById("profileEmail").value = userData.emailID;

// Show first letter in avatar
const avatar = document.getElementById("avatar");
if(userData.full_name){
  avatar.textContent = userData.full_name.charAt(0).toUpperCase();
}
          } else {
            console.error("Failed to fetch profile:", response.status, response.statusText);
            const errorData = await response.json().catch(() => ({}));
            console.error("Error details:", errorData);
            alert("Session expired or invalid. Please login again.");
            window.location.href = "./login.html";
          }
        } catch (error) {
          console.error("Error fetching profile:", error);
          alert("An error occurred while fetching your profile. Please check your connection.");
        }
      }

      // Fetch profile on page load
      document.addEventListener('DOMContentLoaded', fetchProfile);
    </script>
  </body>
</html>
